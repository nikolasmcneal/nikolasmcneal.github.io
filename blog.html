<!DOCTYPE html>
<html lang="en">
<head>
    <title>Blog | Nikolas McNeal</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Nikolas McNeal's blog" />
    <script>
        // Pick the theme before the page draws: saved choice, else light
        (function () {
            var theme = null;
            try { theme = localStorage.getItem('theme'); } catch (e) {}
            if (!theme) theme = 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        /* Colors: pale yellow by default, dark navy in dark mode */
        :root {
            --bg: #fdfbe9;
            --text: #000;
            --link: blue;
            --muted: #666;
        }
        :root[data-theme="dark"] {
            --bg: #0f1a2e;
            --text: #e6e4dc;
            --link: #8cb4ff;
            --muted: #9aa7bb;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: "Times New Roman", Times, serif;
            line-height: 1.25;
        }

        #wrapper {
            max-width: 760px;
            margin: 0 auto;
            padding: 24px 16px 48px;
            position: relative;
        }

        #theme-toggle {
            position: absolute;
            top: 24px;
            right: 16px;
            background: none;
            border: none;
            padding: 0;
            font-size: 32px;
            line-height: 1;
            color: var(--text);
            cursor: pointer;
        }

        a {
            text-decoration: none;
            color: var(--link);
        }

        h1 { margin: 0 0 4px; }

        ul {
            padding-left: 20px;
        }
        li {
            margin-bottom: 6px;
        }

        .date {
            color: var(--muted);
        }
    </style>
</head>

<body>
<div id="wrapper">
    <button id="theme-toggle" type="button" aria-label="Toggle dark mode"></button>
    <p><a href="index.html">[home]</a></p>
    <h1>Blog</h1>

    <!-- Add posts newest first, e.g.
    <ul>
        <li><span class="date">[2026-11-05]</span> <a href="blog/my-first-post.html">My first post</a></li>
    </ul>
    -->
    <p><i>No posts yet. Check back soon!</i></p>
</div>
<script>
    // Light/dark switch: moon in light mode, sun in dark mode
    (function () {
        var button = document.getElementById('theme-toggle');
        function show() {
            var dark = document.documentElement.getAttribute('data-theme') === 'dark';
            button.textContent = dark ? '\u2600\uFE0E' : '\u263E';
            button.title = dark ? 'Switch to light mode' : 'Switch to dark mode';
        }
        button.addEventListener('click', function () {
            var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            try { localStorage.setItem('theme', next); } catch (e) {}
            show();
        });
        show();
    })();
</script>
</body>
</html>
